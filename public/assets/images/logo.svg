<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFF66" />
      <stop offset="100%" stop-color="#D4FF00" />
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="100%" stop-color="#181B22" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4FF00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sleek Dark Container Card -->
  <rect x="2" y="2" width="456" height="106" rx="20" fill="#0C0E12" stroke="url(#badgeBorder)" stroke-width="2" />

  <!-- Geometric Shield Emblem -->
  <g transform="translate(24, 19)">
    <!-- Hexagonal / Shield Base -->
    <path d="M 36 0 L 68 12 L 68 46 C 68 60 52 70 36 74 C 20 70 4 60 4 46 L 4 12 Z" fill="url(#shieldGrad)" stroke="#262B37" stroke-width="2" />
    <path d="M 36 6 L 62 16 L 62 45 C 62 56 48 64 36 68 C 24 64 10 56 10 45 L 10 16 Z" fill="#11141B" />
    
    <!-- Neon Kinetic Lightning Symbol -->
    <path d="M 40 14 L 20 38 L 34 38 L 28 60 L 52 34 L 38 34 Z" fill="url(#neonGlow)" filter="url(#boltShadow)" />
  </g>

  <!-- Typography Brand Header -->
  <!-- KINETICA -->
  <text x="114" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#FFFFFF">KINETICA<tspan fill="#D4FF00">.</tspan></text>

  <!-- Subtitle Tagline -->
  <text x="116" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.5" fill="#8C93A4">WARSAW BIOMECHANICS CLUB</text>

  <!-- High-Tech Neon Pulse Dots -->
  <circle cx="414" cy="55" r="3.5" fill="#D4FF00" />
  <circle cx="414" cy="55" r="7" stroke="#D4FF00" stroke-opacity="0.25" stroke-width="1.5" />
  <circle cx="430" cy="55" r="2.5" fill="#2E3544" />
</svg>
